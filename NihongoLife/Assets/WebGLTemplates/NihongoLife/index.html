<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0e1116">
  <meta name="description" content="NihongoLife is a Japanese learning game. Walk a city, talk to people, and study as you live there.">
  <meta name="color-scheme" content="dark">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{{ PRODUCT_NAME }}}">
  <meta property="og:description" content="Learn Japanese by living in the city. A WebGL game from VTC Academy.">
  <meta property="og:image" content="TemplateData/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{{ PRODUCT_NAME }}}">
  <meta name="twitter:description" content="Learn Japanese by living in the city.">
  <meta name="twitter:image" content="TemplateData/og.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>{{{ PRODUCT_NAME }}}</title>
  <link rel="icon" href="TemplateData/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="TemplateData/favicon.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="TemplateData/apple-touch-icon.png">
  <link rel="stylesheet" href="TemplateData/style.css">
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="unity-loading" role="status" aria-live="polite">
      <div id="nl-slides" aria-hidden="true"></div>
      <div class="petal" style="--x:12%;--d:9s;--s:14px"></div>
      <div class="petal" style="--x:28%;--d:12s;--s:10px"></div>
      <div class="petal" style="--x:46%;--d:8s;--s:16px"></div>
      <div class="petal" style="--x:63%;--d:11s;--s:12px"></div>
      <div class="petal" style="--x:78%;--d:10s;--s:9px"></div>
      <div class="petal" style="--x:90%;--d:13s;--s:15px"></div>
      <div id="nl-stage">
        <div id="nl-avatar" aria-hidden="true"><div id="nl-avatar-inner"></div></div>
        <div id="nl-head">
          <div id="unity-loading-kana">日本語ライフ</div>
          <div id="unity-loading-title">{{{ PRODUCT_NAME }}}</div>
          <div id="nl-tagline"></div>
        </div>
        <div id="unity-progress"><div id="unity-progress-bar"></div></div>
        <div id="nl-status"><span id="unity-loading-text">Loading…</span><span id="nl-percent">0%</span></div>
        <div id="nl-word">
          <div id="nl-word-label"></div>
          <div id="nl-word-ja"></div>
          <div id="nl-word-romaji"></div>
          <div id="nl-word-meaning"></div>
          <div id="nl-tip"></div>
        </div>
      </div>
    </div>
    <button id="unity-fullscreen" type="button" hidden>Fullscreen</button>
    <div id="unity-orient" hidden>
      <div id="unity-orient-phone" aria-hidden="true">&#128241;</div>
      <p id="unity-orient-text">Turn your phone sideways to play.</p>
      <button id="unity-orient-go" type="button">Full screen &middot; landscape</button>
      <button id="unity-orient-ok" type="button">Keep playing in portrait</button>
    </div>
    <div id="unity-warning"></div>
  </div>
  <!-- Online settings (public Supabase URL / anon key, Agora App ID), written by the build next to index.html. -->
  <script src="nl-config.js"></script>
  <script>
    var canvas = document.querySelector("#unity-canvas");
    var loading = document.querySelector("#unity-loading");
    var bar = document.querySelector("#unity-progress-bar");
    var loadingText = document.querySelector("#unity-loading-text");
    var warning = document.querySelector("#unity-warning");
    var fullscreen = document.querySelector("#unity-fullscreen");
    var orient = document.querySelector("#unity-orient");

    function unityShowBanner(msg, type) {
      warning.textContent = msg || "";
      warning.style.display = msg ? "block" : "none";
    }

    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
    var config = {
      dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
      frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
      codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#if MEMORY_FILENAME
      memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
      symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
      streamingAssetsUrl: "StreamingAssets",
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      showBanner: unityShowBanner,
    };

    // Cap HiDPI. The in-game Web graphics button writes the same localStorage key; it applies on the next load.
    var dprCap = 1.5;
    try {
      var stored = parseFloat(localStorage.getItem("nihongo.webgl.dprCap"));
      if (!isNaN(stored) && stored >= 0.5 && stored <= 3) dprCap = stored;
    } catch (e) {}
    config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, dprCap);

    function coarsePointer() {
      return window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
    }

    // Phones play in landscape: joystick on the left, actions on the right. Held upright, a full-screen card asks to turn
    // the phone; its button goes full screen and locks landscape where the browser allows it (Android Chrome; iOS Safari
    // cannot lock, so turning the phone is enough). "Keep playing in portrait" never leaves anyone stuck.
    (function () {
      var l = ((navigator.language || "en").slice(0, 2)).toLowerCase();
      function t(vi, en, ja, ru) { return l === "vi" ? vi : l === "ja" ? ja : l === "ru" ? ru : en; }
      document.querySelector("#unity-orient-text").textContent = t("Xoay ngang điện thoại để chơi.", "Turn your phone sideways to play.", "スマホを横にして遊んでね。", "Поверните телефон горизонтально.");
      document.querySelector("#unity-orient-go").textContent = t("Toàn màn hình · Xoay ngang", "Full screen · landscape", "全画面・横向き", "Во весь экран · горизонтально");
      document.querySelector("#unity-orient-ok").textContent = t("Vẫn chơi màn hình dọc", "Keep playing in portrait", "縦のまま遊ぶ", "Играть вертикально");
    })();

    function refreshOrient() {
      var portrait = window.matchMedia("(orientation: portrait)").matches;
      var dismissed = false;
      try { dismissed = sessionStorage.getItem("nihongo.orientHint") === "1"; } catch (e) {}
      orient.hidden = !(portrait && coarsePointer() && !dismissed);
    }

    function goLandscape() {
      var root = document.documentElement;
      var request = root.requestFullscreen || root.webkitRequestFullscreen;
      var done = function () {
        try { if (screen.orientation && screen.orientation.lock) screen.orientation.lock("landscape").catch(function () {}); } catch (e) {}
      };
      try {
        var result = request ? request.call(root) : null;
        if (result && result.then) result.then(done, done); else done();
      } catch (e) { done(); }
    }

    document.querySelector("#unity-orient-go").addEventListener("click", goLandscape);
    document.querySelector("#unity-orient-ok").addEventListener("click", function () {
      try { sessionStorage.setItem("nihongo.orientHint", "1"); } catch (e) {}
      orient.hidden = true;
    });
    // The first tap of a phone player in landscape also takes the game full screen (the browser bars eat the joystick).
    window.addEventListener("touchend", function firstTap() {
      window.removeEventListener("touchend", firstTap);
      if (coarsePointer() && !document.fullscreenElement && window.matchMedia("(orientation: landscape)").matches) goLandscape();
    }, { passive: true });
    window.addEventListener("resize", refreshOrient);
    window.addEventListener("orientationchange", refreshOrient);
    refreshOrient();

    fullscreen.addEventListener("click", function () {
      if (window.unityInstance && window.unityInstance.SetFullscreen) window.unityInstance.SetFullscreen(1);
    });

    // ─── The loader: pictures of the town, the characters, a phrase to learn (TemplateData/art, LoadingArtBuilder) ───
    var lang = ((navigator.language || "en").slice(0, 2)).toLowerCase();
    function pick(vi, en, ja) { return lang === "vi" ? vi : lang === "ja" ? ja : en; }
    var percentText = document.querySelector("#nl-percent");
    var avatarRing = document.querySelector("#nl-avatar");
    document.querySelector("#nl-tagline").textContent = pick("Sống ở Nhật, học tiếng Nhật — ngay trên trình duyệt.", "Live in Japan, learn Japanese — right in your browser.", "日本で暮らして、日本語を学ぼう。");
    document.querySelector("#nl-word-label").textContent = pick("HỌC TRONG LÚC CHỜ · 今日のことば", "LEARN WHILE YOU WAIT · 今日のことば", "待つあいだに · 今日のことば");
    var scenes = ["90-testsandbox", "20-stationdistrict", "30-sushirestaurant", "40-hibariclass", "35-hibariclinic", "50-gamecenter", "60-midoriisland", "65-phuquocisland", "45-homebedroom"];
    var kids = ["kid-haruto", "kid-yui", "kid-sota", "kid-hina", "kid-riku", "kid-mio", "kid-yuto", "kid-sakura"];
    var words = [
      ["いってきます", "ittekimasu", "Con đi đây (khi ra khỏi nhà)", "I'm off (leaving home)"],
      ["いただきます", "itadakimasu", "Mời cả nhà (trước khi ăn)", "Said before eating"],
      ["きっぷを ください", "kippu o kudasai", "Cho tôi một vé", "A ticket, please"],
      ["つぎは ミナトです", "tsugi wa Minato desu", "Ga tiếp theo là Minato", "The next stop is Minato"],
      ["いくらですか", "ikura desu ka", "Bao nhiêu tiền?", "How much is it?"],
      ["あたためますか", "atatamemasu ka", "Có cần hâm nóng không?", "Shall I heat it up?"],
      ["おだいじに", "odaiji ni", "Chúc mau khoẻ", "Get well soon"],
      ["おつかれさまでした", "otsukaresama deshita", "Anh chị vất vả rồi", "Thanks for your hard work"],
      ["もう いちど おねがいします", "mō ichido onegai shimasu", "Xin nói lại một lần nữa", "Once more, please"],
      ["うみが きれいですね", "umi ga kirei desu ne", "Biển đẹp quá nhỉ", "The sea is beautiful, isn't it"]
    ];
    var tips = [
      ["Bấm vào ví ¥ để mở ngân hàng: hết tiền ăn có quỹ khẩn cấp không lãi.", "Click the ¥ wallet for the bank: an interest-free emergency fund if you run out of food money.", "財布¥から銀行へ。食費に困ったら無利子の緊急資金があります。"],
      ["Nhiều người quanh bạn? Nhấn Q để đổi, hoặc bấm chuột vào người đó — bấm lần nữa để nói chuyện.", "People all around? Press Q to switch or click someone — click again to talk.", "人が多いときはQかクリック。もう一度クリックで話しかけます。"],
      ["Phím Y mở Sổ tay: các địa điểm, bệnh và thuốc như ngoài đời.", "Y opens the Handbook: places, illnesses and real medicine.", "Yでハンドブック：場所・病気と薬。"],
      ["Đi tàu từ ga Hibari: Gakuen-mae, Minato, Đảo Xanh, và sân bay đi Phú Quốc.", "Trains from Hibari: Gakuen-mae, Minato, Midori Island and the airport for Phú Quốc.", "ひばり駅から学園前・ミナト・みどり島、そして空港からフーコックへ。"]
    ];
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var slideBox = document.querySelector("#nl-slides"), slides = [], slideAt = -1;
    scenes.forEach(function (name) {
      var img = new Image();
      img.onload = function () {
        var div = document.createElement("div");
        div.className = "nl-slide";
        div.style.backgroundImage = "url('TemplateData/art/" + name + ".jpg')";
        slideBox.appendChild(div);
        slides.push(div);
        if (slides.length === 1) nextSlide();
      };
      img.src = "TemplateData/art/" + name + ".jpg";
    });
    function nextSlide() {
      if (!slides.length) return;
      if (slideAt >= 0) slides[slideAt].classList.remove("on");
      slideAt = (slideAt + 1) % slides.length;
      void slides[slideAt].offsetWidth; // restart the push-in
      slides[slideAt].classList.add("on");
    }
    var faces = [], faceAt = -1, faceBox = document.querySelector("#nl-avatar-inner");
    kids.forEach(function (name) {
      var img = new Image();
      img.alt = "";
      img.onload = function () { faceBox.appendChild(img); faces.push(img); if (faces.length === 1) nextFace(); };
      img.src = "TemplateData/art/" + name + ".png";
    });
    function nextFace() {
      if (!faces.length) return;
      if (faceAt >= 0) faces[faceAt].classList.remove("on");
      faceAt = (faceAt + 1) % faces.length;
      faces[faceAt].classList.add("on");
    }
    var wordAt = Math.floor(Math.random() * words.length), tipAt = Math.floor(Math.random() * tips.length);
    function nextWord() {
      var w = words[wordAt++ % words.length], t = tips[tipAt++ % tips.length];
      document.querySelector("#nl-word-ja").textContent = w[0];
      document.querySelector("#nl-word-romaji").textContent = w[1];
      document.querySelector("#nl-word-meaning").textContent = lang === "vi" ? w[2] : w[3];
      document.querySelector("#nl-tip").textContent = pick(t[0], t[1], t[2]);
    }
    nextWord();
    var timers = [setInterval(nextSlide, reduce ? 12000 : 7000), setInterval(nextFace, 1800), setInterval(nextWord, 6500)];

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        var pct = Math.round(progress * 100);
        bar.style.width = pct + "%";
        percentText.textContent = pct + "%";
        avatarRing.style.setProperty("--p", pct);
        // Unity reports about 90% once the download is done; the rest is unpacking and starting the engine.
        loadingText.textContent = progress < 0.9 ? pick("Đang tải dữ liệu game…", "Downloading the game…", "ゲームをダウンロード中…")
          : progress < 1 ? pick("Đang giải nén…", "Unpacking…", "展開中…") : pick("Đang khởi động thị trấn…", "Starting the town…", "町を準備中…");
      }).then(function (instance) {
        loading.style.display = "none";
        timers.forEach(clearInterval);
        fullscreen.hidden = false;
        window.unityInstance = instance;
        window.nihongoDprCap = dprCap;
      }).catch(function (message) {
        loadingText.textContent = String(message);
        console.error(message);
      });
    };
    script.onerror = function () {
      loadingText.textContent = "Could not load the game. Check that the Build folder is next to this page and that the server allows .wasm and .unityweb.";
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
