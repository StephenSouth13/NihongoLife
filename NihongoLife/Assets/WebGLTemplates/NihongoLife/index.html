<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0e1116">
  <meta name="description" content="NihongoLife is a Japanese learning game. Walk a city, talk to people, and study as you live there.">
  <meta name="color-scheme" content="dark">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{{ PRODUCT_NAME }}}">
  <meta property="og:description" content="Learn Japanese by living in the city. A WebGL game from VTC Academy.">
  <meta property="og:image" content="TemplateData/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{{ PRODUCT_NAME }}}">
  <meta name="twitter:description" content="Learn Japanese by living in the city.">
  <meta name="twitter:image" content="TemplateData/og.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>{{{ PRODUCT_NAME }}}</title>
  <link rel="icon" href="TemplateData/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="TemplateData/favicon.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="TemplateData/apple-touch-icon.png">
  <link rel="stylesheet" href="TemplateData/style.css">
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="unity-loading" role="status" aria-live="polite">
      <div class="petal" style="--x:12%;--d:9s;--s:14px"></div>
      <div class="petal" style="--x:28%;--d:12s;--s:10px"></div>
      <div class="petal" style="--x:46%;--d:8s;--s:16px"></div>
      <div class="petal" style="--x:63%;--d:11s;--s:12px"></div>
      <div class="petal" style="--x:78%;--d:10s;--s:9px"></div>
      <div class="petal" style="--x:90%;--d:13s;--s:15px"></div>
      <div id="unity-mark" aria-hidden="true"></div>
      <div id="unity-loading-kana">日本語ライフ</div>
      <div id="unity-loading-title">{{{ PRODUCT_NAME }}}</div>
      <div id="unity-progress"><div id="unity-progress-bar"></div></div>
      <div id="unity-loading-text">Loading…</div>
    </div>
    <button id="unity-fullscreen" type="button" hidden>Fullscreen</button>
    <div id="unity-orient" hidden>
      <p id="unity-orient-text">Portrait works. Turn sideways for a wider view of the city.</p>
      <button id="unity-orient-ok" type="button">Continue</button>
    </div>
    <div id="unity-warning"></div>
  </div>
  <script>
    var canvas = document.querySelector("#unity-canvas");
    var loading = document.querySelector("#unity-loading");
    var bar = document.querySelector("#unity-progress-bar");
    var loadingText = document.querySelector("#unity-loading-text");
    var warning = document.querySelector("#unity-warning");
    var fullscreen = document.querySelector("#unity-fullscreen");
    var orient = document.querySelector("#unity-orient");

    function unityShowBanner(msg, type) {
      warning.textContent = msg || "";
      warning.style.display = msg ? "block" : "none";
    }

    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
    var config = {
      dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
      frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
      codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#if MEMORY_FILENAME
      memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
      symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
      streamingAssetsUrl: "StreamingAssets",
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      showBanner: unityShowBanner,
    };

    // Cap HiDPI. The in-game Web graphics button writes the same localStorage key; it applies on the next load.
    var dprCap = 1.5;
    try {
      var stored = parseFloat(localStorage.getItem("nihongo.webgl.dprCap"));
      if (!isNaN(stored) && stored >= 0.5 && stored <= 3) dprCap = stored;
    } catch (e) {}
    config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, dprCap);

    function coarsePointer() {
      return window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
    }

    function refreshOrient() {
      var portrait = window.matchMedia("(orientation: portrait)").matches;
      var dismissed = false;
      try { dismissed = sessionStorage.getItem("nihongo.orientHint") === "1"; } catch (e) {}
      orient.hidden = !(portrait && coarsePointer() && !dismissed);
    }

    document.querySelector("#unity-orient-ok").addEventListener("click", function () {
      try { sessionStorage.setItem("nihongo.orientHint", "1"); } catch (e) {}
      orient.hidden = true;
    });
    window.addEventListener("resize", refreshOrient);
    window.addEventListener("orientationchange", refreshOrient);
    refreshOrient();

    fullscreen.addEventListener("click", function () {
      if (window.unityInstance && window.unityInstance.SetFullscreen) window.unityInstance.SetFullscreen(1);
    });

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        var pct = Math.round(progress * 100);
        bar.style.width = pct + "%";
        loadingText.textContent = progress < 1 ? ("Loading " + pct + "%") : "Starting…";
      }).then(function (instance) {
        loading.style.display = "none";
        fullscreen.hidden = false;
        window.unityInstance = instance;
        window.nihongoDprCap = dprCap;
      }).catch(function (message) {
        loadingText.textContent = String(message);
        console.error(message);
      });
    };
    script.onerror = function () {
      loadingText.textContent = "Could not load the game. Check that the Build folder is next to this page and that the server allows .wasm and .unityweb.";
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
