<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>{{TITLE}}</title>
  <link rel="stylesheet" href="cards.css">
</head>
<body>
<article class="card {{CLASS}} {{SIZE}}" style="--pos:{{POS}};--zoom:{{ZOOM}};">
  <img class="photo" src="{{SHOT}}" alt="">
  <div class="scrim"></div>
  <header class="top">
    <div class="mark">NL</div>
    <div class="brand-block">
      <div class="brand">NIHONGO LIFE</div>
      <div class="jp">日本語ライフ</div>
    </div>
    <div class="week-chip">Tuần {{WEEK}}</div>
  </header>
  <div class="copy">
    <div class="stamp">CẦN ẢNH MỚI</div>
    <div class="kicker">{{KICKER}}</div>
    <h1>{{LINES}}</h1>
    <p class="sub">{{SUB}}</p>
    {{BULLETS}}
    <div class="foot">
      <div class="cta">{{CTA}}</div>
      <div class="meta">{{META}}</div>
    </div>
  </div>
</article>
</body>
</html>
